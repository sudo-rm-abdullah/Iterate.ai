<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProjectPulse Settings</title>
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>ProjectPulse Settings</h1>
        <button type="button" class="theme-toggle" id="theme-toggle" title="Toggle theme">◐</button>
      </header>
      <p class="redirect-note">
        Full settings are available in the <a href="#" id="open-dashboard">Dashboard</a>.
      </p>
      <section class="card">
        <h2>Privacy</h2>
        <p class="notice">
          All captured activity stays in your browser (chrome.storage.local + IndexedDB).
          Your code and metrics are sent to <strong>Groq</strong> only when you manually
          trigger an analysis or enable scheduled analysis.
        </p>
      </section>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
